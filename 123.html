<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RM2026 赛季备赛时间节点与研发流程量表</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #fef3c7 100%);
    color: #1e293b;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1600px; margin: 0 auto; }
  .header {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(71, 85, 105, 0.2);
  }
  .header h1 {
    font-size: 28px;
    background: linear-gradient(90deg, #d97706, #dc2626, #db2777);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    outline: none;
    border-radius: 4px;
    padding: 2px 6px;
  }
  .header h1:focus { background: rgba(59,130,246,0.1); -webkit-text-fill-color: #1e293b; }
  .header p {
    color: #475569; font-size: 14px; outline: none;
    border-radius: 4px; padding: 2px 6px;
  }
  .header p:focus { background: rgba(59,130,246,0.1); color: #1e293b; }
  .chart-box {
    background: #ffffff;
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
  }
  #mainChart { width: 100%; height: 680px; }

  /* 编辑面板 */
  .edit-panel {
    background: #fffbeb;
    border: 1px solid rgba(217, 119, 6, 0.5);
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .edit-panel-header {
    background: rgba(217, 119, 6, 0.1);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .edit-panel-header h2 { font-size: 16px; color: #b45309; }
  .edit-panel-header .hint { font-size: 12px; color: #64748b; }
  .edit-panel-body { padding: 18px; display: none; }
  .edit-panel.open .edit-panel-body { display: block; }
  .edit-panel .arrow { transition: transform 0.2s; color: #b45309; }
  .edit-panel.open .arrow { transform: rotate(90deg); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    align-items: center;
  }
  .btn {
    background: #eff6ff;
    border: 1px solid #93c5fd;
    color: #1d4ed8;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .btn:hover { background: #dbeafe; }
  .btn-green { background: #ecfdf5; border-color: #6ee7b7; color: #047857; }
  .btn-green:hover { background: #d1fae5; }
  .btn-red { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
  .btn-red:hover { background: #fee2e2; }
  .btn-amber { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
  .btn-amber:hover { background: #fef3c7; }

  /* 可编辑表格 */
  .edit-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .edit-table th {
    background: #eff6ff;
    color: #1e40af;
    padding: 8px 6px;
    text-align: center;
    font-weight: 600;
    white-space: nowrap;
    border-bottom: 1px solid #bfdbfe;
  }
  .edit-table td { padding: 4px 4px; border-bottom: 1px solid rgba(203, 213, 225, 0.6); }
  .edit-table input, .edit-table select {
    width: 100%;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    padding: 5px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
  }
  .edit-table input:focus, .edit-table select:focus {
    border-color: #d97706;
    outline: 2px solid rgba(217, 119, 6, 0.15);
    outline-offset: -1px;
    background: #ffffff;
  }
  .edit-table input[type="number"] { text-align: center; }
  .edit-table input[type="color"] { padding: 2px; height: 30px; cursor: pointer; }
  .col-narrow { width: 70px; }
  .col-num { width: 75px; }
  .col-color { width: 50px; }
  .col-del { width: 50px; }
  .del-btn {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    width: 100%;
    padding: 4px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .del-btn:hover { background: #fee2e2; }

  .section-title {
    font-size: 13px;
    color: #b45309;
    margin: 16px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px dashed rgba(217, 119, 6, 0.3);
  }

  .label-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .label-input-row label { font-size: 12px; color: #475569; min-width: 120px; }
  .label-input-row input, .label-input-row select {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
    flex: 1;
    min-width: 150px;
  }
  .label-input-row input:focus {
    border-color: #d97706;
    outline: 2px solid rgba(217, 119, 6, 0.15);
    outline-offset: -1px;
  }

  .info-card-edit {
    background: #f8fafc;
    border-left: 3px solid;
    border-radius: 6px;
    padding: 12px 15px;
    border: 1px solid #e2e8f0;
    border-left-width: 3px;
  }
  .info-card-edit h3 {
    font-size: 14px; margin-bottom: 6px; outline: none;
    border-radius: 4px; padding: 2px 4px;
  }
  .info-card-edit h3:focus { background: rgba(59,130,246,0.08); }
  .info-card-edit p {
    font-size: 12px; color: #475569; line-height: 1.6; outline: none;
    border-radius: 4px; padding: 2px 4px;
  }
  .info-card-edit p:focus { background: rgba(59,130,246,0.08); color: #0f172a; }
  .legend-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 15px;
  }

  .phase-display-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 13px;
  }
  .phase-display-table th, .phase-display-table td {
    padding: 10px 12px; text-align: left;
    border-bottom: 1px solid rgba(203, 213, 225, 0.6);
  }
  .phase-display-table th {
    background: #eff6ff;
    color: #1e40af; font-weight: 600;
  }
  .phase-display-table tr:hover { background: #f8fafc; }
  .tag {
    display: inline-block; padding: 2px 8px;
    border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #059669; color: #fff;
    padding: 10px 24px; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(5, 150, 105, 0.3);
    font-size: 14px; transition: transform 0.3s; z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 contenteditable="true" id="pageTitle">RM2026 赛季备赛时间节点与研发流程量表</h1>
    <p contenteditable="true" id="pageSubtitle">横轴：时间节点 ｜ 左纵轴：工作量（柱状图） ｜ 右纵轴：时间价值（折线图，单调递减）</p>
  </div>

  <!-- 编辑面板 -->
  <div class="edit-panel open" id="editPanel">
    <div class="edit-panel-header" onclick="togglePanel()">
      <h2>编辑面板（所有文本与数字均可修改，图表实时更新）</h2>
      <span class="hint">点击折叠/展开 <span class="arrow">▶</span></span>
    </div>
    <div class="edit-panel-body">

      <!-- 图表标题 -->
      <div class="section-title">图表标题与副标题</div>
      <div class="label-input-row">
        <label>图表主标题</label>
        <input type="text" id="cfgTitle" value="RM2026 赛季备赛工作量与时间价值分布">
      </div>
      <div class="label-input-row">
        <label>图表副标题</label>
        <input type="text" id="cfgSubtitle" value="数据基于 RoboMaster 赛季时间节点与合理研发流程建议">
      </div>

      <!-- 坐标轴配置 -->
      <div class="section-title">坐标轴配置</div>
      <div class="label-input-row">
        <label>左纵轴名称</label>
        <input type="text" id="cfgY1Name" value="工作量">
        <label>最大值</label>
        <input type="number" id="cfgY1Max" value="100" style="max-width:80px;">
        <label>高强度阈值</label>
        <input type="number" id="cfgThreshold" value="80" style="max-width:80px;">
      </div>
      <div class="label-input-row">
        <label>右纵轴名称</label>
        <input type="text" id="cfgY2Name" value="时间价值">
        <label>最大值</label>
        <input type="number" id="cfgY2Max" value="100" style="max-width:80px;">
      </div>

      <!-- 阶段分区标签 -->
      <div class="section-title">阶段分区标签（图表顶部标注，留空则不显示）</div>
      <div id="zoneLabelsContainer"></div>

      <!-- 双高峰标注 -->
      <div class="section-title">柱状图高峰标注（填写数据行序号，从0开始）</div>
      <div class="label-input-row">
        <label>第一高峰 序号</label>
        <input type="number" id="cfgPeak1Idx" value="3" style="max-width:70px;">
        <label>标注文字</label>
        <input type="text" id="cfgPeak1Text" value="核心模块研发" style="max-width:160px;">
        <label>第二高峰 序号</label>
        <input type="number" id="cfgPeak2Idx" value="6" style="max-width:70px;">
        <label>标注文字</label>
        <input type="text" id="cfgPeak2Text" value="联盟赛准备" style="max-width:160px;">
      </div>

      <!-- 数据表 -->
      <div class="section-title">数据编辑（时间、阶段、任务、工作量、时间价值、类型、颜色）</div>
      <div class="toolbar">
        <button class="btn btn-green" onclick="addRow()">+ 添加一行</button>
        <button class="btn btn-amber" onclick="exportJSON()">导出 JSON</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">导入 JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
        <button class="btn btn-red" onclick="resetData()">重置默认数据</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="edit-table" id="editTable">
          <thead>
            <tr>
              <th class="col-narrow">时间节点</th>
              <th>阶段简称</th>
              <th>核心任务</th>
              <th class="col-num">工作量</th>
              <th class="col-num">时间价值</th>
              <th class="col-narrow">类型</th>
              <th class="col-color">颜色</th>
              <th class="col-del">删除</th>
            </tr>
          </thead>
          <tbody id="editTableBody"></tbody>
        </table>
      </div>

      <!-- 信息卡片 -->
      <div class="section-title">信息卡片（点击文字可直接编辑）</div>
      <div class="legend-info" id="infoCardsContainer"></div>

    </div>
  </div>

  <!-- 图表 -->
  <div class="chart-box">
    <div id="mainChart"></div>
  </div>

  <!-- 阶段显示表 -->
  <div class="chart-box">
    <h3 style="margin-bottom:12px;color:#fbbf24;">阶段说明与工作量/时间价值解析</h3>
    <table class="phase-display-table">
      <thead>
        <tr>
          <th>时间节点</th>
          <th>阶段</th>
          <th>核心任务</th>
          <th>工作量</th>
          <th>时间价值</th>
          <th>类型</th>
        </tr>
      </thead>
      <tbody id="phaseTableBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== 默认数据 ==================== */
const DEFAULT_PHASES = [
  { time: '2025/09', short: '招新月',       task: '招新、新人培训、机器人维护、预研发启动',           workload: 55, value: 100, type: '筹备期',   color: '#3b82f6' },
  { time: '2025/10', short: '校内赛',       task: '校内赛、新人训练、通用技术研发',                 workload: 65, value: 92,  type: '筹备期',   color: '#3b82f6' },
  { time: '2025/11', short: '规则出台',     task: '规则学习、核心模块绘图发加工（期中考前）',         workload: 85, value: 84,  type: '集训期',   color: '#14b8a6' },
  { time: '2025/12', short: '核心模块研发', task: '核心模块加工装配、电控调试、迭代',               workload: 95, value: 76,  type: '集训期',   color: '#14b8a6' },
  { time: '2026/01', short: '期末迭代',     task: '剩余模块绘图加工、核心模块迭代、整车完整性',       workload: 72, value: 68,  type: '集训期',   color: '#14b8a6' },
  { time: '2026/02', short: '寒假研发',     task: '完整形态视频、各部分迭代优化、模块化迭代',         workload: 80, value: 60,  type: '研发密集期', color: '#f59e0b' },
  { time: '2026/03上', short: '联盟赛准备', task: '完整视频、调试、结构优化、模拟比赛训练',           workload: 90, value: 52,  type: '研发密集期', color: '#f59e0b' },
  { time: '2026/03末', short: '联盟赛',     task: '联盟赛参赛、赛后复盘',                           workload: 58, value: 44,  type: '比赛期',   color: '#8b5cf6' },
  { time: '2026/04', short: '分区赛准备',   task: '机器人维护、电控视觉调试、操作手训练、模拟赛',     workload: 52, value: 32,  type: '比赛期',   color: '#8b5cf6' },
  { time: '2026/05', short: '分区赛',       task: '分区赛参赛',                                     workload: 48, value: 20,  type: '比赛期',   color: '#8b5cf6' }
];

const DEFAULT_ZONES = [
  { text: '筹备期',   left: '12%', color: '#3b82f6' },
  { text: '集训期',   left: '36%', color: '#14b8a6' },
  { text: '研发密集期', left: '62%', color: '#f59e0b' },
  { text: '比赛期',   left: '82%', color: '#8b5cf6' }
];

const DEFAULT_CARDS = [
  { title: '柱状图 - 工作量', color: '#3b82f6', titleColor: '#2563eb',
    text: '反映该阶段机械/电控/视觉各组的综合工作强度（0-100）。研发密集期工作量峰值，比赛期工作量集中于调试与维护。' },
  { title: '折线图 - 时间价值', color: '#ef4444', titleColor: '#dc2626',
    text: '同一份工作在越早完成，可迭代次数越多，对最终比赛贡献越大。曲线单调递减：9月完成的工作价值≈100，分区赛前完成的工作价值仅≈20。' },
  { title: '研发流程建议', color: '#14b8a6', titleColor: '#0d9488',
    text: '优先做满足核心需求的模块而非整车；做完立即给电控调试；一边调一边根据反馈修改；模块化设计便于维护。早完成=高时间价值。' },
  { title: '关键节点', color: '#f59e0b', titleColor: '#d97706',
    text: '规则出台（约11月）→ 核心模块研发（期中考后）→ 整车完整（期末前）→ 完整视频（寒假）→ 联盟赛（3月末）→ 分区赛（5月）。' }
];

/* ==================== 运行时状态 ==================== */
let phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
let zones = JSON.parse(JSON.stringify(DEFAULT_ZONES));
let cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
const TYPE_OPTIONS = ['筹备期','集训期','研发密集期','比赛期','其他'];

const chart = echarts.init(document.getElementById('mainChart'));

/* ==================== 渲染编辑表 ==================== */
function renderEditTable() {
  const tbody = document.getElementById('editTableBody');
  tbody.innerHTML = '';
  phases.forEach((p, i) => {
    const tr = document.createElement('tr');
    const typeOpts = TYPE_OPTIONS.map(t =>
      `<option value="${t}" ${p.type===t?'selected':''}>${t}</option>`
    ).join('');
    tr.innerHTML = `
      <td><input type="text" value="${p.time}" onchange="updateCell(${i},'time',this.value)"></td>
      <td><input type="text" value="${p.short}" onchange="updateCell(${i},'short',this.value)"></td>
      <td><input type="text" value="${p.task}" onchange="updateCell(${i},'task',this.value)"></td>
      <td><input type="number" value="${p.workload}" min="0" max="999" onchange="updateCell(${i},'workload',+this.value)"></td>
      <td><input type="number" value="${p.value}" min="0" max="999" onchange="updateCell(${i},'value',+this.value)"></td>
      <td><select onchange="updateCell(${i},'type',this.value)">${typeOpts}</select></td>
      <td><input type="color" value="${p.color}" onchange="updateCell(${i},'color',this.value)"></td>
      <td><button class="del-btn" onclick="deleteRow(${i})">删除</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function updateCell(idx, key, val) {
  phases[idx][key] = val;
  refreshAll();
}

function addRow() {
  phases.push({ time: '新节点', short: '新阶段', task: '任务描述', workload: 50, value: 50, type: '其他', color: '#a78bfa' });
  renderEditTable();
  refreshAll();
  showToast('已添加一行');
}

function deleteRow(idx) {
  if (phases.length <= 1) { showToast('至少保留一行数据', true); return; }
  phases.splice(idx, 1);
  renderEditTable();
  refreshAll();
  showToast('已删除');
}

/* ==================== 渲染分区标签编辑 ==================== */
function renderZoneLabels() {
  const container = document.getElementById('zoneLabelsContainer');
  container.innerHTML = '';
  zones.forEach((z, i) => {
    const row = document.createElement('div');
    row.className = 'label-input-row';
    row.innerHTML = `
      <label>标签 ${i+1} 文字</label>
      <input type="text" value="${z.text}" onchange="updateZone(${i},'text',this.value)" style="max-width:140px;">
      <label>位置(%)</label>
      <input type="text" value="${z.left}" onchange="updateZone(${i},'left',this.value)" style="max-width:80px;">
      <label>颜色</label>
      <input type="color" value="${z.color}" onchange="updateZone(${i},'color',this.value)" style="max-width:50px;">
      <button class="del-btn" onclick="deleteZone(${i})" style="max-width:60px;">删除</button>
    `;
    container.appendChild(row);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-green';
  addBtn.textContent = '+ 添加标签';
  addBtn.onclick = addZone;
  container.appendChild(addBtn);
}

function updateZone(idx, key, val) { zones[idx][key] = val; refreshAll(); }
function addZone() { zones.push({ text: '新标签', left: '50%', color: '#a78bfa' }); renderZoneLabels(); refreshAll(); }
function deleteZone(idx) { zones.splice(idx,1); renderZoneLabels(); refreshAll(); }

/* ==================== 渲染信息卡片 ==================== */
function renderInfoCards() {
  const container = document.getElementById('infoCardsContainer');
  container.innerHTML = '';
  cards.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'info-card-edit';
    div.style.borderLeftColor = c.color;
    div.innerHTML = `
      <h3 contenteditable="true" style="color:${c.titleColor};" oninput="updateCard(${i},'title',this.innerText)">${c.title}</h3>
      <p contenteditable="true" oninput="updateCard(${i},'text',this.innerText)">${c.text}</p>
      <div style="margin-top:8px;display:flex;gap:6px;align-items:center;">
        <input type="color" value="${c.color}" onchange="updateCard(${i},'color',this.value)" style="width:30px;height:24px;">
        <button class="del-btn" onclick="deleteCard(${i})" style="max-width:60px;">删除卡片</button>
      </div>
    `;
    container.appendChild(div);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-green';
  addBtn.textContent = '+ 添加卡片';
  addBtn.style.marginTop = '10px';
  addBtn.onclick = addCard;
  container.appendChild(addBtn);
}

function updateCard(idx, key, val) { cards[idx][key] = val; }
function addCard() { cards.push({ title:'新卡片', color:'#a78bfa', titleColor:'#c4b5fd', text:'卡片内容' }); renderInfoCards(); }
function deleteCard(idx) { cards.splice(idx,1); renderInfoCards(); }

/* ==================== 图表渲染 ==================== */
function buildOption() {
  const title = document.getElementById('cfgTitle').value;
  const subtitle = document.getElementById('cfgSubtitle').value;
  const y1Name = document.getElementById('cfgY1Name').value;
  const y1Max = +document.getElementById('cfgY1Max').value || 100;
  const y2Name = document.getElementById('cfgY2Name').value;
  const y2Max = +document.getElementById('cfgY2Max').value || 100;
  const threshold = +document.getElementById('cfgThreshold').value || 80;
  const peak1Idx = +document.getElementById('cfgPeak1Idx').value;
  const peak1Text = document.getElementById('cfgPeak1Text').value;
  const peak2Idx = +document.getElementById('cfgPeak2Idx').value;
  const peak2Text = document.getElementById('cfgPeak2Text').value;

  const graphicArr = zones
    .filter(z => z.text.trim() !== '')
    .map(z => ({
      type: 'text', left: z.left, top: 100,
      style: { text: z.text, fill: z.color, fontSize: 12, fontWeight: 'bold' }
    }));

  const peakData = [];
  if (peak1Idx >= 0 && peak1Idx < phases.length) {
    peakData.push({ coord: [peak1Idx, phases[peak1Idx].workload], name: '第一高峰', value: peak1Text });
  }
  if (peak2Idx >= 0 && peak2Idx < phases.length) {
    peakData.push({ coord: [peak2Idx, phases[peak2Idx].workload], name: '第二高峰', value: peak2Text });
  }

  return {
    backgroundColor: 'transparent',
    title: {
      text: title, subtext: subtitle, left: 'center',
      textStyle: { color: '#0f172a', fontSize: 18 },
      subtextStyle: { color: '#64748b', fontSize: 12 }
    },
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross', crossStyle: { color: '#94a3b8' } },
      backgroundColor: 'rgba(255, 255, 255, 0.98)',
      borderColor: 'rgba(203, 213, 225, 0.8)',
      textStyle: { color: '#0f172a' },
      extraCssText: 'box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); border-radius: 8px;',
      formatter: function(params) {
        const idx = params[0].dataIndex;
        const p = phases[idx];
        if (!p) return '';
        let html = `<div style="font-weight:700;margin-bottom:6px;color:#b45309;">${p.time} · ${p.short}</div>`;
        html += `<div style="font-size:12px;color:#475569;margin-bottom:8px;">类型：<span style="background:${p.color}22;color:${p.color};padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;">${p.type}</span></div>`;
        params.forEach(item => {
          html += `<div style="margin:3px 0;">${item.marker} ${item.seriesName}：<b style="color:${item.color};">${item.value}</b></div>`;
        });
        html += `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(148,163,184,0.5);font-size:12px;color:#334155;">${p.task}</div>`;
        return html;
      }
    },
    legend: { data: [y1Name, y2Name], top: 60, textStyle: { color: '#334155' } },
    grid: { left: 70, right: 70, bottom: 110, top: 120 },
    xAxis: {
      type: 'category',
      data: phases.map(p => p.time + '\n' + p.short),
      axisLine: { lineStyle: { color: '#94a3b8' } },
      axisLabel: { color: '#334155', fontSize: 11, lineHeight: 16, interval: 0 },
      axisTick: { alignWithLabel: true }
    },
    yAxis: [
      { type: 'value', name: y1Name, position: 'left', min: 0, max: y1Max,
        nameTextStyle: { color: '#2563eb', fontSize: 13, fontWeight: 'bold' },
        axisLine: { lineStyle: { color: '#2563eb' } },
        axisLabel: { color: '#3b82f6', formatter: '{value}' },
        splitLine: { lineStyle: { color: 'rgba(203, 213, 225, 0.8)' } } },
      { type: 'value', name: y2Name, position: 'right', min: 0, max: y2Max,
        nameTextStyle: { color: '#dc2626', fontSize: 13, fontWeight: 'bold' },
        axisLine: { lineStyle: { color: '#dc2626' } },
        axisLabel: { color: '#ef4444', formatter: '{value}' },
        splitLine: { show: false } }
    ],
    series: [
      {
        name: y1Name, type: 'bar', yAxisIndex: 0,
        data: phases.map(p => ({
          value: p.workload,
          itemStyle: {
            color: p.color,
            borderRadius: [6, 6, 0, 0]
          }
        })),
        barWidth: '45%',
        label: { show: true, position: 'top', color: '#1e293b', fontSize: 11, fontWeight: 'bold' },
        markLine: {
          silent: true, symbol: 'none',
          lineStyle: { color: '#d97706', type: 'dashed', width: 1.5 },
          label: { color: '#b45309', fontSize: 10 },
          data: [{ yAxis: threshold, name: '高强度阈值', label: { formatter: '高强度阈值 ' + threshold, position: 'end' } }]
        },
        markPoint: peakData.length ? {
          symbol: 'pin', symbolSize: 50,
          itemStyle: { color: '#d97706' },
          label: { color: '#fff', fontSize: 10 },
          data: peakData
        } : undefined
      },
      {
        name: y2Name, type: 'line', yAxisIndex: 1,
        data: phases.map(p => p.value),
        smooth: true, symbol: 'circle', symbolSize: 10,
        lineStyle: { color: '#dc2626', width: 3 },
        itemStyle: { color: '#dc2626', borderColor: '#ffffff', borderWidth: 2 },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(220, 38, 38, 0.30)' },
            { offset: 1, color: 'rgba(220, 38, 38, 0.02)' }
          ])
        },
        label: { show: true, color: '#dc2626', fontSize: 11, fontWeight: 'bold', formatter: '{c}' },
        markPoint: {
          symbol: 'pin', symbolSize: 55,
          itemStyle: { color: '#d97706' },
          label: { color: '#fff', fontSize: 11 },
          data: [ { type: 'max', name: '最高价值' }, { type: 'min', name: '最低价值' } ]
        }
      }
    ],
    graphic: graphicArr
  };
}

function renderChart() {
  chart.setOption(buildOption(), true);
}

/* ==================== 显示表渲染 ==================== */
function renderDisplayTable() {
  const tbody = document.getElementById('phaseTableBody');
  tbody.innerHTML = '';
  phases.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${p.time}</b></td>
      <td>${p.short}</td>
      <td>${p.task}</td>
      <td><span style="color:#60a5fa;font-weight:bold;">${p.workload}</span></td>
      <td><span style="color:#f87171;font-weight:bold;">${p.value}</span></td>
      <td><span class="tag" style="background:${p.color}33;color:${p.color};">${p.type}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

/* ==================== 统一刷新 ==================== */
function refreshAll() {
  renderChart();
  renderDisplayTable();
}

/* ==================== 面板折叠 ==================== */
function togglePanel() {
  document.getElementById('editPanel').classList.toggle('open');
}

/* ==================== 导入导出 ==================== */
function exportJSON() {
  const data = {
    pageTitle: document.getElementById('pageTitle').innerText,
    pageSubtitle: document.getElementById('pageSubtitle').innerText,
    cfgTitle: document.getElementById('cfgTitle').value,
    cfgSubtitle: document.getElementById('cfgSubtitle').value,
    cfgY1Name: document.getElementById('cfgY1Name').value,
    cfgY1Max: document.getElementById('cfgY1Max').value,
    cfgY2Name: document.getElementById('cfgY2Name').value,
    cfgY2Max: document.getElementById('cfgY2Max').value,
    cfgThreshold: document.getElementById('cfgThreshold').value,
    cfgPeak1Idx: document.getElementById('cfgPeak1Idx').value,
    cfgPeak1Text: document.getElementById('cfgPeak1Text').value,
    cfgPeak2Idx: document.getElementById('cfgPeak2Idx').value,
    cfgPeak2Text: document.getElementById('cfgPeak2Text').value,
    phases: phases,
    zones: zones,
    cards: cards
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rm2026_config.json';
  a.click();
  showToast('已导出 JSON 配置');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (d.pageTitle) document.getElementById('pageTitle').innerText = d.pageTitle;
      if (d.pageSubtitle) document.getElementById('pageSubtitle').innerText = d.pageSubtitle;
      ['cfgTitle','cfgSubtitle','cfgY1Name','cfgY1Max','cfgY2Name','cfgY2Max','cfgThreshold','cfgPeak1Idx','cfgPeak1Text','cfgPeak2Idx','cfgPeak2Text'].forEach(id => {
        if (d[id] !== undefined) document.getElementById(id).value = d[id];
      });
      if (d.phases) phases = d.phases;
      if (d.zones) zones = d.zones;
      if (d.cards) cards = d.cards;
      renderEditTable();
      renderZoneLabels();
      renderInfoCards();
      refreshAll();
      showToast('导入成功');
    } catch (err) {
      showToast('导入失败：' + err.message, true);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确认重置为默认数据？所有修改将丢失。')) return;
  phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
  zones = JSON.parse(JSON.stringify(DEFAULT_ZONES));
  cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
  document.getElementById('cfgTitle').value = 'RM2026 赛季备赛工作量与时间价值分布';
  document.getElementById('cfgSubtitle').value = '数据基于 RoboMaster 赛季时间节点与合理研发流程建议';
  document.getElementById('cfgY1Name').value = '工作量';
  document.getElementById('cfgY1Max').value = 100;
  document.getElementById('cfgY2Name').value = '时间价值';
  document.getElementById('cfgY2Max').value = 100;
  document.getElementById('cfgThreshold').value = 80;
  document.getElementById('cfgPeak1Idx').value = 3;
  document.getElementById('cfgPeak1Text').value = '核心模块研发';
  document.getElementById('cfgPeak2Idx').value = 6;
  document.getElementById('cfgPeak2Text').value = '联盟赛准备';
  renderEditTable();
  renderZoneLabels();
  renderInfoCards();
  refreshAll();
  showToast('已重置为默认数据');
}

/* ==================== Toast ==================== */
let toastTimer;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'rgba(239,68,68,0.9)' : 'rgba(16,185,129,0.9)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ==================== 绑定配置输入实时更新 ==================== */
['cfgTitle','cfgSubtitle','cfgY1Name','cfgY1Max','cfgY2Name','cfgY2Max','cfgThreshold','cfgPeak1Idx','cfgPeak1Text','cfgPeak2Idx','cfgPeak2Text'].forEach(id => {
  document.getElementById(id).addEventListener('input', refreshAll);
});

/* ==================== 初始化 ==================== */
renderEditTable();
renderZoneLabels();
renderInfoCards();
refreshAll();
window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
